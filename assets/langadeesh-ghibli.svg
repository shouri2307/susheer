<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fb4ff"/><stop offset=".7" stop-color="#bfe6ff"/><stop offset="1" stop-color="#fff2cf"/></linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff7c2"/><stop offset="1" stop-color="#fff7c2" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#1d3f9f"/><path d="M0 0 H22 M0 0 V22" stroke="#e9f0ff" stroke-width="1.8" opacity=".85"/></pattern>
  </defs>
  <rect width="300" height="400" fill="url(#sky)"/>
  <circle cx="240" cy="70" r="70" fill="url(#sun)"/>
  <g fill="#fff" opacity=".95">
    <ellipse cx="60" cy="70" rx="38" ry="14"/><ellipse cx="86" cy="58" rx="28" ry="15"/><ellipse cx="40" cy="62" rx="22" ry="11"/>
    <ellipse cx="228" cy="120" rx="34" ry="12"/><ellipse cx="250" cy="110" rx="22" ry="11"/>
    <ellipse cx="150" cy="40" rx="30" ry="9" opacity=".7"/>
  </g>
  <path d="M0 300 C60 250 110 270 160 285 C210 300 250 255 300 270 V400 H0 Z" fill="#7cc576"/>
  <path d="M0 330 C70 300 120 320 180 330 C230 338 270 310 300 320 V400 H0 Z" fill="#4fa860"/>
  <g fill="#ffe97a"><circle cx="30" cy="350" r="3"/><circle cx="270" cy="345" r="3"/><circle cx="248" cy="372" r="2.4"/><circle cx="52" cy="376" r="2.4"/></g>
  <g fill="#fff"><circle cx="40" cy="330" r="2.2"/><circle cx="262" cy="330" r="2.2"/></g>
  <!-- character -->
  <g transform="translate(34 78) scale(1.45)" stroke-linejoin="round">
    <ellipse cx="80" cy="196" rx="52" ry="5" fill="rgba(0,0,0,.25)"/>
    <!-- plaid shirt -->
    <path d="M18 200 C18 156 46 138 80 138 C114 138 142 156 142 200 Z" fill="url(#grid)" stroke="#3a2620" stroke-width="2.4"/>
    <path d="M62 139 L80 178 L98 139 Z" fill="#c99067" stroke="#3a2620" stroke-width="2"/>
    <path d="M58 138 L80 178 L66 150 Z M102 138 L80 178 L94 150 Z" fill="url(#grid)" stroke="#3a2620" stroke-width="2"/>
    <path d="M80 178 V200" stroke="#e9f0ff" stroke-width="1.6"/>
    <!-- neck + ears -->
    <rect x="67" y="116" width="26" height="28" rx="8" fill="#b98259"/>
    <ellipse cx="42" cy="92" rx="6.5" ry="10" fill="#cf9a70" stroke="#3a2620" stroke-width="2"/>
    <ellipse cx="118" cy="92" rx="6.5" ry="10" fill="#cf9a70" stroke="#3a2620" stroke-width="2"/>
    <!-- face -->
    <path d="M43 80 C43 48 60 40 80 40 C100 40 117 48 117 80 C117 112 102 136 80 136 C58 136 43 112 43 80 Z" fill="#dba97f" stroke="#3a2620" stroke-width="2.4"/>
    <ellipse cx="55" cy="101" rx="8" ry="5" fill="#f0836a" opacity=".35"/><ellipse cx="105" cy="101" rx="8" ry="5" fill="#f0836a" opacity=".35"/>
    <!-- light stubble on chin -->
    <path d="M62 126 C70 134 90 134 98 126 C92 130 68 130 62 126 Z" fill="#3a2a24" opacity=".35"/>
    <!-- thick swept hair -->
    <path d="M38 84 C28 40 52 18 86 20 C118 20 138 42 122 86 C120 64 108 52 84 52 C62 52 46 62 38 84 Z" fill="#17120f" stroke="#3a2620" stroke-width="2"/>
    <path d="M48 46 C54 14 104 6 124 40 C102 30 74 28 48 46 Z" fill="#17120f"/>
    <path d="M62 30 q22 -10 44 2 M70 38 q18 -6 34 2" stroke="#4a403c" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- brows -->
    <path d="M56 73 Q66 67 77 72" stroke="#17120f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M84 72 Q94 67 105 73" stroke="#17120f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- eyes -->
    <g><ellipse cx="66" cy="86" rx="5.8" ry="7.4" fill="#1b100d"/><circle cx="68" cy="83.4" r="2.1" fill="#fff"/>
       <ellipse cx="94" cy="86" rx="5.8" ry="7.4" fill="#1b100d"/><circle cx="96" cy="83.4" r="2.1" fill="#fff"/></g>
    <!-- nose -->
    <path d="M78 91 Q75 100 78 101.5 Q80 103 82 101.5 Q85 100 82 91" fill="#c78d63" stroke="#3a2620" stroke-width="1.5" opacity=".9"/>
    <!-- moustache -->
    <path d="M60 108 C68 99 75 103 80 105 C85 103 92 99 100 108 C93 107 87 108 80 108 C73 108 67 107 60 108 Z" fill="#241a17"/>
    <!-- smile -->
    <path d="M68 118 Q80 128 92 118" stroke="#6a2c28" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="108" y="70" font-size="14">✨</text>
  </g>
</svg>
